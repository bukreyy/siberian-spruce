spring:
  datasource:
    url: jdbc:tc:postgresql:17-alpine:///test-account-db
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  test:
    database:
      replace: none
